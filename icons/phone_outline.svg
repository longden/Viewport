<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="outline-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Linear Stroke Gradient (Optional styling) -->
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Group: Complete Phone Outline -->
  <g id="phone-outline" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Layer 1: Phone Body Outer Frame -->
    <g id="phone-body">
      <rect x="136" y="36" width="240" height="440" rx="42" stroke-width="12"/>
    </g>

    <!-- Layer 2: Side Buttons -->
    <g id="phone-side-buttons" stroke-width="10">
      <!-- Volume Up -->
      <line x1="128" y1="120" x2="128" y2="156"/>
      <!-- Volume Down -->
      <line x1="128" y1="176" x2="128" y2="212"/>
      <!-- Power / Lock Button -->
      <line x1="384" y1="140" x2="384" y2="190"/>
    </g>

    <!-- Layer 3: Screen Area Boundary -->
    <g id="phone-screen" stroke-width="6" opacity="0.8">
      <rect x="154" y="54" width="204" height="404" rx="30"/>
    </g>

    <!-- Layer 4: Dynamic Island / Camera Notch -->
    <g id="phone-notch">
      <rect x="220" y="68" width="72" height="18" rx="9" fill="currentColor" stroke="none"/>
      <!-- Camera Lens Dot -->
      <circle cx="278" cy="77" r="3" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Layer 5: Speaker Grill / Receiver Slot -->
    <g id="phone-speaker">
      <line x1="236" y1="46" x2="276" y2="46" stroke-width="4"/>
    </g>

    <!-- Layer 6: Home Indicator Bar -->
    <g id="phone-home-bar">
      <line x1="220" y1="444" x2="292" y2="444" stroke-width="6"/>
    </g>

  </g>
</svg>
