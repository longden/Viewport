<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="desk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    
    <linearGradient id="monitor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group 1: Background Base -->
  <g id="layer-background">
    <circle cx="256" cy="256" r="236" fill="url(#desk-bg)"/>
    <circle cx="256" cy="256" r="235" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  </g>

  <!-- Group 2: Sync Pulse Rings -->
  <g id="layer-sync-rings" stroke="url(#cyan-glow)" stroke-width="1.5" stroke-dasharray="6,6" fill="none" opacity="0.6">
    <ellipse cx="256" cy="280" rx="190" ry="90"/>
    <ellipse cx="256" cy="280" rx="130" ry="60"/>
  </g>

  <!-- Group 3: Main Display / Web Screen -->
  <g id="layer-web-display">
    <!-- Screen Frame -->
    <rect x="116" y="96" width="280" height="180" rx="12" fill="url(#monitor-grad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="124" y="124" width="264" height="144" rx="6" fill="url(#cyan-glow)"/>
    <!-- Screen Header Bar -->
    <rect x="124" y="104" width="264" height="16" rx="4" fill="#0f172a"/>
    <circle cx="134" cy="112" r="3" fill="#ef4444"/>
    <circle cx="144" cy="112" r="3" fill="#f59e0b"/>
    <circle cx="154" cy="112" r="3" fill="#10b981"/>
    <!-- Code / Layout Lines on Screen -->
    <rect x="140" y="140" width="80" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="140" y="160" width="140" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="140" y="174" width="100" height="8" rx="2" fill="#ffffff" opacity="0.6"/>
    <rect x="140" y="196" width="232" height="56" rx="6" fill="rgba(255,255,255,0.2)"/>
    <!-- Stand -->
    <path d="M 236 276 L 226 316 L 286 316 L 276 276 Z" fill="#1e293b"/>
    <rect x="206" y="316" width="100" height="8" rx="4" fill="#334155"/>
  </g>

  <!-- Group 4: Left Mobile Device (Android) -->
  <g id="layer-android-device">
    <rect x="76" y="240" width="104" height="196" rx="18" fill="#090d16" stroke="#10b981" stroke-width="2"/>
    <rect x="82" y="254" width="92" height="168" rx="12" fill="url(#emerald-glow)"/>
    <!-- Camera hole -->
    <circle cx="128" cy="247" r="3" fill="#000000"/>
    <!-- Mock UI -->
    <rect x="94" y="270" width="68" height="12" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="94" y="292" width="68" height="40" rx="8" fill="rgba(255,255,255,0.25)"/>
    <rect x="94" y="340" width="68" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Group 5: Right Mobile Device (iOS) -->
  <g id="layer-ios-device">
    <rect x="332" y="240" width="104" height="196" rx="20" fill="#0f0c29" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="338" y="254" width="92" height="168" rx="14" fill="url(#purple-glow)"/>
    <!-- Notch / Pill -->
    <rect x="366" y="246" width="36" height="6" rx="3" fill="#000000"/>
    <!-- Mock UI -->
    <rect x="350" y="270" width="68" height="32" rx="8" fill="rgba(255,255,255,0.3)"/>
    <rect x="350" y="310" width="68" height="32" rx="8" fill="rgba(255,255,255,0.2)"/>
    <rect x="350" y="350" width="68" height="50" rx="8" fill="rgba(255,255,255,0.2)"/>
    <!-- Home Bar -->
    <rect x="366" y="412" width="36" height="3" rx="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Group 6: Central Connection Sparkle -->
  <g id="layer-center-sparkle" filter="url(#glow-effect)">
    <circle cx="256" cy="380" r="16" fill="#38bdf8"/>
    <path d="M 256 356 L 260 376 L 280 380 L 260 384 L 256 404 L 252 384 L 232 380 L 252 376 Z" fill="#ffffff"/>
  </g>
</svg>
