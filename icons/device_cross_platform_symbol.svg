<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-space" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#09090e"/>
    </radialGradient>

    <!-- Web Gradient (Cyan) -->
    <linearGradient id="grad-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Android Gradient (Green) -->
    <linearGradient id="grad-android" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- iOS Gradient (Purple) -->
    <linearGradient id="grad-ios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Core Bevel Gradient -->
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LAYER 1: Dark Canvas -->
  <g id="layer-background">
    <rect width="512" height="512" rx="108" fill="url(#bg-space)"/>
    <rect width="512" height="512" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  </g>

  <!-- LAYER 2: Triangular Orbital Track -->
  <g id="layer-orbital-tracks" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none">
    <polygon points="256,110 400,360 112,360"/>
    <circle cx="256" cy="276" r="140" stroke-dasharray="4,8"/>
  </g>

  <!-- LAYER 3: Web Node (Top Peak) -->
  <g id="layer-node-web" filter="url(#soft-glow)">
    <!-- Outer Shield / Hexagon -->
    <path d="M 256 70 L 300 95 L 300 145 L 256 170 L 212 145 L 212 95 Z" fill="url(#grad-web)"/>
    <!-- Globe / Web Lines -->
    <circle cx="256" cy="120" r="24" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="256" cy="120" rx="10" ry="24" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="232" y1="120" x2="280" y2="120" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- LAYER 4: Android Node (Bottom Right) -->
  <g id="layer-node-android" filter="url(#soft-glow)">
    <path d="M 400 320 L 444 345 L 444 395 L 400 420 L 356 395 L 356 345 Z" fill="url(#grad-android)"/>
    <!-- Android Bug / Device Motif -->
    <path d="M 384 378 A 16 16 0 0 1 416 378 Z" fill="#ffffff"/>
    <!-- Antennae -->
    <line x1="390" y1="360" x2="384" y2="354" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="410" y1="360" x2="416" y2="354" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="392" cy="370" r="2" fill="#059669"/>
    <circle cx="408" cy="370" r="2" fill="#059669"/>
  </g>

  <!-- LAYER 5: iOS Node (Bottom Left) -->
  <g id="layer-node-ios" filter="url(#soft-glow)">
    <path d="M 112 320 L 156 345 L 156 395 L 112 420 L 68 395 L 68 345 Z" fill="url(#grad-ios)"/>
    <!-- iOS Mobile Device Silhouette -->
    <rect x="98" y="352" width="28" height="44" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="106" y="356" width="12" height="3" rx="1.5" fill="#ffffff"/>
    <circle cx="112" cy="390" r="2" fill="#ffffff"/>
  </g>

  <!-- LAYER 6: Central Unified Viewport Hub -->
  <g id="layer-hub-core">
    <!-- Connecting Energy Beams -->
    <line x1="256" y1="170" x2="256" y2="230" stroke="url(#grad-web)" stroke-width="4" stroke-linecap="round"/>
    <line x1="356" y1="345" x2="300" y2="310" stroke="url(#grad-android)" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="345" x2="212" y2="310" stroke="url(#grad-ios)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Central Glass Core -->
    <circle cx="256" cy="276" r="46" fill="#0f172a" stroke="url(#grad-core)" stroke-width="3"/>
    <circle cx="256" cy="276" r="34" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Viewport 3-Pane Icon in Center -->
    <rect x="236" y="260" width="10" height="32" rx="2" fill="#38bdf8"/>
    <rect x="251" y="260" width="10" height="32" rx="2" fill="#34d399"/>
    <rect x="266" y="260" width="10" height="32" rx="2" fill="#c084fc"/>
  </g>
</svg>
