<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Minimalist Phone Outline Icon -->
  <g id="minimal-phone" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone Frame -->
    <rect x="144" y="48" width="224" height="416" rx="38"/>
    <!-- Speaker Bar -->
    <line x1="224" y1="88" x2="288" y2="88" stroke-width="12"/>
    <!-- Home Button / Indicator Dot -->
    <circle cx="256" cy="420" r="10" fill="currentColor" stroke="none"/>
  </g>
</svg>
