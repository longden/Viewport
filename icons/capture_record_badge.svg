<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Metallic Gradient -->
    <radialGradient id="lens-body" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Outer Ring -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="50%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <!-- Glass Refraction -->
    <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>

    <!-- Neon Rec Red -->
    <radialGradient id="rec-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#b30000"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-lens" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="red-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LAYER 1: Lens Base Shadow & Body -->
  <g id="layer-lens-base" filter="url(#shadow-lens)">
    <circle cx="256" cy="256" r="220" fill="url(#lens-body)"/>
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ring-grad)" stroke-width="8"/>
  </g>

  <!-- LAYER 2: Aperture / Shutter Blades Ring -->
  <g id="layer-aperture-ring">
    <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.1)" stroke-dasharray="4,8" stroke-width="6"/>
  </g>

  <!-- LAYER 3: Camera Shutter Blades -->
  <g id="layer-shutter-blades" fill="#1e293b" stroke="#0f172a" stroke-width="2" opacity="0.95">
    <!-- 6 Interlocking Aperture Blades -->
    <path d="M 256 100 Q 320 160 300 220 L 220 180 Z"/>
    <path d="M 391 178 Q 391 260 330 280 L 310 190 Z"/>
    <path d="M 391 334 Q 327 391 267 331 L 310 250 Z"/>
    <path d="M 256 412 Q 192 352 212 292 L 292 332 Z"/>
    <path d="M 121 334 Q 121 252 182 232 L 202 322 Z"/>
    <path d="M 121 178 Q 185 121 245 181 L 202 262 Z"/>
  </g>

  <!-- LAYER 4: Inner Glass Lens -->
  <g id="layer-inner-lens">
    <circle cx="256" cy="256" r="96" fill="#090d16" stroke="url(#ring-grad)" stroke-width="3"/>
    <circle cx="256" cy="256" r="70" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  </g>

  <!-- LAYER 5: Lens Glare Reflection -->
  <g id="layer-glass-glare">
    <path d="M 170 140 Q 256 96 342 140 Q 256 180 170 140 Z" fill="url(#glass-reflection)"/>
    <ellipse cx="210" cy="210" rx="30" ry="15" transform="rotate(-30 210 210)" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- LAYER 6: Viewfinder Corner Crosshairs -->
  <g id="layer-viewfinder-crosshairs" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <!-- Top-Left Bracket -->
    <path d="M 96 128 L 96 96 L 128 96" fill="none"/>
    <!-- Top-Right Bracket -->
    <path d="M 384 96 L 416 96 L 416 128" fill="none"/>
    <!-- Bottom-Left Bracket -->
    <path d="M 96 384 L 96 416 L 128 416" fill="none"/>
    <!-- Bottom-Right Bracket -->
    <path d="M 384 416 L 416 416 L 416 384" fill="none"/>
  </g>

  <!-- LAYER 7: Live RECORD Badge (Red Glow Dot) -->
  <g id="layer-record-badge" filter="url(#red-glow)">
    <circle cx="256" cy="256" r="32" fill="url(#rec-glow)"/>
    <circle cx="256" cy="256" r="32" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8"/>
    <circle cx="246" cy="246" r="8" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
