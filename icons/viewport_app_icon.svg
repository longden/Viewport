<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    
    <!-- Desk Glass Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
    
    <!-- Web Pane Gradient -->
    <linearGradient id="web-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Android Pane Gradient -->
    <linearGradient id="android-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- iOS Pane Gradient -->
    <linearGradient id="ios-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LAYER 1: Base Squircle / App Icon Background -->
  <g id="layer-background">
    <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)"/>
    <!-- Inner border illumination -->
    <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="url(#border-glow)" stroke-width="2"/>
  </g>

  <!-- LAYER 2: Viewing Desk Panel -->
  <g id="layer-desk-panel" filter="url(#shadow)">
    <rect x="64" y="96" width="384" height="320" rx="24" fill="url(#glass-grad)"/>
    <rect x="64" y="96" width="384" height="320" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  </g>

  <!-- LAYER 3: Web Pane (Left) -->
  <g id="layer-web-pane" filter="url(#shadow)">
    <rect x="84" y="128" width="100" height="256" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- Web Header -->
    <rect x="84" y="128" width="100" height="24" rx="12" fill="#1e293b"/>
    <circle cx="96" cy="140" r="3" fill="#ef4444"/>
    <circle cx="106" cy="140" r="3" fill="#f59e0b"/>
    <circle cx="116" cy="140" r="3" fill="#10b981"/>
    <!-- Address Bar -->
    <rect x="126" y="134" width="50" height="12" rx="4" fill="#334155"/>
    <!-- Web Screen Content -->
    <rect x="88" y="156" width="92" height="220" rx="8" fill="url(#web-screen)"/>
    <!-- Mock UI Elements -->
    <rect x="96" y="170" width="48" height="8" rx="4" fill="rgba(255,255,255,0.8)"/>
    <rect x="96" y="186" width="76" height="36" rx="6" fill="rgba(255,255,255,0.25)"/>
    <rect x="96" y="230" width="76" height="60" rx="6" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- LAYER 4: Android Pane (Center) -->
  <g id="layer-android-pane" filter="url(#shadow)">
    <rect x="206" y="128" width="100" height="256" rx="16" fill="#090d16" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Android Hole Punch Camera -->
    <circle cx="256" cy="138" r="3" fill="#000000"/>
    <circle cx="256" cy="138" r="1.5" fill="#1e293b"/>
    <!-- Screen Content -->
    <rect x="210" y="146" width="92" height="230" rx="10" fill="url(#android-screen)"/>
    <!-- Android UI Elements -->
    <rect x="218" y="160" width="76" height="12" rx="4" fill="rgba(255,255,255,0.85)"/>
    <circle cx="230" cy="195" r="14" fill="rgba(255,255,255,0.3)"/>
    <circle cx="266" cy="195" r="14" fill="rgba(255,255,255,0.3)"/>
    <rect x="218" y="222" width="76" height="70" rx="8" fill="rgba(255,255,255,0.2)"/>
    <!-- Android Navigation Bar -->
    <rect x="240" y="368" width="32" height="3" rx="1.5" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- LAYER 5: iOS Pane (Right) -->
  <g id="layer-ios-pane" filter="url(#shadow)">
    <rect x="328" y="128" width="100" height="256" rx="18" fill="#0c0a1d" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Dynamic Island -->
    <rect x="360" y="134" width="36" height="8" rx="4" fill="#000000"/>
    <!-- Screen Content -->
    <rect x="332" y="146" width="92" height="230" rx="12" fill="url(#ios-screen)"/>
    <!-- iOS UI Elements -->
    <rect x="340" y="160" width="76" height="40" rx="10" fill="rgba(255,255,255,0.25)"/>
    <rect x="340" y="210" width="76" height="40" rx="10" fill="rgba(255,255,255,0.18)"/>
    <rect x="340" y="260" width="76" height="40" rx="10" fill="rgba(255,255,255,0.18)"/>
    <!-- iOS Home Bar -->
    <rect x="360" y="368" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.8)"/>
  </g>

  <!-- LAYER 6: Viewfinder Corner Accents -->
  <g id="layer-viewfinder-overlay" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Top Left Corner -->
    <path d="M 54 86 L 54 74 Q 54 64 64 64 L 76 64"/>
    <!-- Top Right Corner -->
    <path d="M 436 64 L 448 64 Q 458 64 458 74 L 458 86"/>
    <!-- Bottom Left Corner -->
    <path d="M 54 426 L 54 438 Q 54 448 64 448 L 76 448"/>
    <!-- Bottom Right Corner -->
    <path d="M 436 448 L 448 448 Q 458 448 458 438 L 458 426"/>
  </g>

  <!-- LAYER 7: Live Status Badge -->
  <g id="layer-status-badge">
    <circle cx="256" cy="80" r="6" fill="#ef4444" filter="url(#glow)"/>
    <circle cx="256" cy="80" r="3" fill="#ffffff"/>
  </g>
</svg>
