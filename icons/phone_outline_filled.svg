<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="phone-screen-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="phone-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Phone Container Group -->
  <g id="phone-container" filter="url(#phone-glow)">
    
    <!-- Outer Metallic Bezel -->
    <rect id="outer-bezel" x="136" y="36" width="240" height="440" rx="42" fill="#090d16" stroke="url(#frame-grad)" stroke-width="8"/>

    <!-- Screen Display Area -->
    <rect id="screen-display" x="146" y="46" width="220" height="420" rx="34" fill="url(#phone-screen-bg)"/>

    <!-- Side Hardware Buttons -->
    <g id="side-buttons" fill="url(#frame-grad)">
      <!-- Mute Switch -->
      <rect x="128" y="90" width="6" height="18" rx="3"/>
      <!-- Volume Up -->
      <rect x="128" y="124" width="6" height="36" rx="3"/>
      <!-- Volume Down -->
      <rect x="128" y="170" width="6" height="36" rx="3"/>
      <!-- Power Button -->
      <rect x="378" y="140" width="6" height="50" rx="3"/>
    </g>

    <!-- Dynamic Island / Sensor Notch -->
    <g id="dynamic-island">
      <rect x="216" y="60" width="80" height="20" rx="10" fill="#000000"/>
      <!-- Lens reflections -->
      <circle cx="230" cy="70" r="4" fill="#0f172a"/>
      <circle cx="282" cy="70" r="3" fill="#1e293b"/>
    </g>

    <!-- Home Indicator Pill -->
    <rect id="home-indicator" x="216" y="450" width="80" height="5" rx="2.5" fill="#ffffff" opacity="0.8"/>
    
  </g>
</svg>
