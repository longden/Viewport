name: Feature request
description: Suggest an enhancement for Viewport
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and any ideas for an approach.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should Viewport behave instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you already tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web pane
        - Android capture / input
        - iOS capture / input
        - Screenshots / recording
        - Developer logs
        - Settings / UX
        - Packaging / docs / CI
        - Other
    validations:
      required: true
